<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>yt step sequencer</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <div class="header">
        <h1>yt step sequencer</h1>
        <div class="options">
          <button id="options-toggle" type="button" aria-label="randomization options"
            aria-expanded="false" aria-controls="options-menu" title="randomization options">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16l-8 13z"></path>
            </svg>
          </button>
          <div id="options-menu" hidden>
            <label>
              <input id="include-empty-steps" type="checkbox">
              empty steps when randomizing
            </label>
          </div>
        </div>
      </div>
      <p id="video-title"></p>

      <div class="sequencer-layout">
        <form id="sequencer" novalidate>
          <fieldset id="settings">
            <legend class="sr-only">sequence</legend>
            <div class="step-row">
              <div class="steps" id="steps"></div>
              <button id="add-step" type="button" aria-label="add empty step" title="add empty step">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"></path></svg>
              </button>
              <button id="remove-step" type="button" aria-label="remove last step" title="remove last step">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l1 2h3v2H4V5h3l1-2zm-2 6h12l-1 12H7L6 9zm3 2 .5 8h1L10 11H9zm5 0-.5 8h1l.5-8h-1z"></path></svg>
              </button>
            </div>
            <div class="link" id="link">
              <svg viewBox="0 0 16 42" aria-hidden="true">
                <path d="M16 1H5v40h11"></path>
              </svg>
              <input id="connect" type="checkbox"
                aria-label="randomize on every step 1"
                title="randomize on every step 1">
            </div>
            <div class="step-controls">
              <button id="randomize" type="button">randomize</button>
              <button id="clear" type="button">clear</button>
              <button id="reset" type="button">reset</button>
              <button id="next-step" type="button">step</button>
            </div>
          </fieldset>
          <div class="controls">
            <div class="tempo">
              <label for="bpm">bpm</label>
              <input id="bpm" name="bpm" type="text" inputmode="numeric"
                maxlength="3" value="120" required pattern="[0-9]+" autocomplete="off"
                aria-describedby="bpm-range">
              <span id="bpm-range" class="sr-only">bpm must be between 1 and 999.</span>
              <button id="bpm-decrease" type="button" aria-label="decrease bpm" title="decrease bpm">−</button>
              <button id="bpm-increase" type="button" aria-label="increase bpm" title="increase bpm">+</button>
            </div>
            <button id="transport" type="submit" aria-label="play" title="play">
              <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 4v16l13-8z"></path>
              </svg>
              <svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 5h14v14H5z"></path>
              </svg>
            </button>
          </div>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
        <p id="timing" aria-live="off" hidden></p>
        <div id="pads" class="pads" role="group" aria-label="live pads"></div>
      </div>
    </main>
  </body>
</html>
